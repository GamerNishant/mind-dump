name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Supabase config
        if: ${{ vars.VITE_SUPABASE_URL == '' || vars.VITE_SUPABASE_ANON_KEY == '' }}
        run: echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repo variables are not set - deploying in device-only mode."
      - name: Build
        run: npm run build
        env:
          # Project pages are served from /<repo>/; a <user>.github.io repo is served from /.
          VITE_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # Public values (the anon key is safe to expose; RLS protects the data).
          # Set them under Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages has no SPA rewrites; serving the app for unknown paths makes deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
